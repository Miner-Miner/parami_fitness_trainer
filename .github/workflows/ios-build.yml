name: Build and upload to TestFlight
on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  TEAM_ID: 56RMQHYVB4                  # 10 characters, from developer.apple.com > Membership details
  PROFILE_NAME: Parami Fitness Trainer        # exact name of the App Store profile
  BUNDLE_ID: website.coreaxistechnologies.paramiFitnessTrainer

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up signing
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          echo -n "$CERT_P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security set-keychain-settings -lut 21600 $KEYCHAIN
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN

          # Apple intermediate + root certificates
          for CERT in AppleWWDRCAG3 AppleWWDRCAG6 AppleIncRootCertificate; do
            curl -sSfL "https://www.apple.com/certificateauthority/$CERT.cer" -o $RUNNER_TEMP/$CERT.cer || true
            [ -s $RUNNER_TEMP/$CERT.cer ] && security import $RUNNER_TEMP/$CERT.cer -k $KEYCHAIN -T /usr/bin/codesign || true
          done

          security import $RUNNER_TEMP/cert.p12 -P "$CERT_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security -k $KEYCHAIN
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN

          security list-keychains -d user -s $KEYCHAIN login.keychain-db
          security default-keychain -s $KEYCHAIN

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision

          echo "--- Identities ---"
          security find-identity -v -p codesigning

      - name: Configure manual signing in Xcode project
        run: |
          PBX=ios/Runner.xcodeproj/project.pbxproj
          perl -ni -e '
            print unless /CODE_SIGN_STYLE|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER/;
            if (/PRODUCT_BUNDLE_IDENTIFIER = \Q$ENV{BUNDLE_ID}\E;/) {
              print "\t\t\t\tCODE_SIGN_STYLE = Manual;\n";
              print "\t\t\t\tDEVELOPMENT_TEAM = $ENV{TEAM_ID};\n";
              print "\t\t\t\t\"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"Apple Distribution\";\n";
              print "\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"$ENV{PROFILE_NAME}\";\n";
            }
          ' $PBX
          grep -n "PROVISIONING_PROFILE_SPECIFIER" $PBX || echo "WARNING: bundle ID not found in project.pbxproj"

      - name: Install dependencies
        run: flutter pub get

      - name: Build IPA
        run: |
          flutter build ipa --release \
            --build-number ${{ github.run_number }} \
            --export-options-plist=ExportOptions.plist

            - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$ASC_KEY_P8_BASE64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -f build/ios/ipa/*.ipa -t ios \
            --apiKey $ASC_KEY_ID --apiIssuer $ASC_ISSUER_ID

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: build/ios/ipa/*.ipa