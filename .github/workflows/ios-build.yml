name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Clean Flutter
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Set iOS deployment target
        run: |
          echo "Setting iOS deployment target to 15.5"

          if [ -f ios/Podfile ]; then
            sed -i '' "s/platform :ios, '[^']*'/platform :ios, '15.5'/" ios/Podfile
          else
            echo "No Podfile found. Flutter/CocoaPods will generate it."
          fi

          find ios -name "project.pbxproj" -exec sed -i '' \
            's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.5/g' {} \;

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r parami_fitness_trainer.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: parami_fitness_trainer-ipa
          path: parami_fitness_trainer.ipa
